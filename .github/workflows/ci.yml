name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.local
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      NEXT_PUBLIC_API_URL: http://localhost:3333
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm run build
      - run: npm run check:bundle
  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: bingo, POSTGRES_PASSWORD: bingo, POSTGRES_DB: go_bingo_e2e }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_API_URL: http://localhost:3333
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      E2E_DATABASE_URL: postgresql://bingo:bingo@localhost:5432/go_bingo_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/go-bingo-back
          token: ${{ secrets.BACK_REPO_TOKEN }}
          path: back
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
        working-directory: back
        env:
          DATABASE_URL: postgresql://bingo:bingo@localhost:5432/go_bingo_e2e
          DIRECT_URL: postgresql://bingo:bingo@localhost:5432/go_bingo_e2e
      - run: npx playwright install --with-deps chromium
      - name: Sobe o back
        working-directory: back
        run: node dist/main &
        env:
          PORT: 3333
          DATABASE_URL: postgresql://bingo:bingo@localhost:5432/go_bingo_e2e
          DIRECT_URL: postgresql://bingo:bingo@localhost:5432/go_bingo_e2e
          CORS_ORIGIN: http://localhost:3000
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      - run: npx wait-on http-get://localhost:3333/health
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report }
